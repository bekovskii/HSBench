[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarife-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "networkx>=3,<4",
    "pydantic>=2.10,<3",
    "lingua-language-detector>=2.1,<3",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["core*", "app*"]

