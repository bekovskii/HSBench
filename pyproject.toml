[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarife-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "networkx>=3,<4",
    "pydantic>=2.10,<3",
    "lingua-language-detector>=2.1,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
search = [
    "faiss-cpu>=1.11,<2",
    "sentence-transformers>=5,<6",
    "polars>=1.31,<2",
    "python-dotenv>=1,<2",
    "translators>=5.9,<6",
    "connectorx>=0.4,<1",
    "pyarrow>=23,<24",
    "instructor>=1.14,<2",
]

[tool.setuptools.packages.find]
include = ["core*", "app*"]

